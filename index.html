<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A new website is coming soon.">
    <title>Coming soon</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #f5f1e8;
        color: #1e2a24;
      }

      main {
        width: min(36rem, calc(100% - 3rem));
      }

      p {
        max-width: 30rem;
        color: #536159;
        font-size: 1.125rem;
        line-height: 1.6;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(3rem, 10vw, 6rem);
        letter-spacing: -0.06em;
        line-height: 0.95;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #15201b;
          color: #f5f1e8;
        }

        p {
          color: #b8c4bc;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Coming soon.</h1>
      <p>This website is being prepared. Please check back shortly.</p>
    </main>
  </body>
</html>
